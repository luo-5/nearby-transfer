plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
    id 'com.google.devtools.ksp' version '2.0.21-1.0.28'
}

android {
    namespace 'io.github.nearbytransfer.android'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.nearbytransfer.android'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'

        // The Java MVP remains the launcher. Compose is isolated behind a build flag
        // until its navigation and persistence layers are production-ready.
        buildConfigField 'boolean', 'ENABLE_COMPOSE_SHELL', 'false'
    }

    buildTypes {
        debug {
            // The experimental activity can be opened explicitly in debug builds.
            buildConfigField 'boolean', 'ENABLE_COMPOSE_SHELL', 'true'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        compose true
    }


    testOptions {
        unitTests.includeAndroidResources = true
    }

    sourceSets {
        debug {
            assets.srcDir file('schemas')
        }
        test {
            resources.srcDir rootProject.file('test/fixtures')
            resources.srcDir file('schemas')
            assets.srcDir file('schemas')
        }
        androidTest {
            assets.srcDir file('schemas')
        }
    }
}

ksp {
    arg("room.schemaLocation", file("$projectDir/schemas").path)
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'

    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}