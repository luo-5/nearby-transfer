# Required by the AndroidX-based Kotlin/Compose migration shell.
android.useAndroidX=true
kotlin.code.style=official
# Gradle's 512 MiB default is too small for a combined Compose/Room test and
# APK packaging run. Keep CI and local builds on the same explicit budget.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# The repo lives under a non-ASCII path (D:\github项目), which AGP rejects by default.
android.overridePathCheck=true
