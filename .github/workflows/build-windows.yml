name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run dist:windows -- --publish never --config.directories.output=dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nearby-transfer-windows
          path: dist/**/*
          if-no-files-found: error
