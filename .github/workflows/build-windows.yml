name: Build Windows

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "packages/core/**"
      - "android-app/src/main/res/drawable/app_icon.png"
      - "scripts/build-vendor.js"
      - "packaging/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run dist:windows -- --config.directories.output=dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nearby-transfer-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
