name: 'Close Stale Issues and PRs'

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue is stale because it has been open 60 days with no activity. Remove stale label or comment or this will be closed in 7 days.'
          close-issue-message: 'This issue was closed because it has been inactive for 7 days since being marked as stale.'
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-pr-message: 'This pull request is stale because it has been open 45 days with no activity. Remove stale label or comment or this will be closed in 7 days.'
          close-pr-message: 'This pull request was closed because it has been inactive for 7 days since being marked as stale.'
          days-before-pr-stale: 45
          days-before-pr-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
