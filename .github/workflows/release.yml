name: Release & npm Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build, Publish npm & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Verify All Packages
        run: npm run ci:verify

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --workspace @luo-5/core --access public
          npm publish --provenance --workspace @luo-5/cli --access public
          npm publish --provenance --workspace @luo-5/localsend-adapter --access public

      - name: Generate npm tarball checksums
        run: |
          mkdir -p release-assets
          npm pack --workspace @luo-5/core --workspace @luo-5/cli --workspace @luo-5/localsend-adapter --pack-destination release-assets
          cd release-assets
          sha256sum *.tgz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/SHA256SUMS.txt
