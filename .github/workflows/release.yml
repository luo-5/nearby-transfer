name: Release & npm Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build, Publish npm & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Test Suite
        run: npm test

      - name: Build Packages
        run: |
          npm run build:core --if-present
          npm run build --workspace @luo-5/cli --if-present

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace @luo-5/core --access public
          npm publish --workspace @luo-5/cli --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
